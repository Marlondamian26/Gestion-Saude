name: E2E Tests

on:
  pull_request:
    branches: [main, belkis-saude]
    paths:
      - 'frontend/e2e/**'
      - 'frontend/src/**'
      - 'backend/**'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run migrations
        run: cd backend && python manage.py migrate --noinput
        env:
          SECRET_KEY: ci-e2e-secret-key-not-for-prod
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
          REDIS_URL: 'redis://localhost:6379/0'
          DEBUG: 'True'

      - name: Seed E2E data
        run: cd backend && python manage.py seed_e2e --password=E2ETest123!
        env:
          SECRET_KEY: ci-e2e-secret-key-not-for-prod
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
          REDIS_URL: 'redis://localhost:6379/0'
          DEBUG: 'True'

      - name: Start backend server
        run: |
          cd backend && python manage.py runserver 0.0.0.0:8000 --noreload &
          sleep 5
        env:
          SECRET_KEY: ci-e2e-secret-key-not-for-prod
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'
          REDIS_URL: 'redis://localhost:6379/0'
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'

      - name: Run E2E tests
        run: cd frontend && npm run e2e 2>&1 || true
        env:
          E2E_BASE_URL: http://localhost:5173
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
