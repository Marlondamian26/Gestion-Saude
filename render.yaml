services:
  - type: web
    name: Gestion-Saude-backend
    runtime: python
    region: oregon
    plan: free
    workingDirectory: backend
    buildCommand: set -e && echo "Installing requirements..." && pip install -r requirements.txt && echo "Running deploy checks..." && python manage.py check --deploy --fail-level WARNING && echo "Migrating..." && python manage.py migrate --noinput --verbosity=2 && echo "Collecting static..." && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers ${RENDER_CPU_COUNT:-1} --threads 4 --timeout 120  # WSGI; alternativa ASGI: uvicorn core.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 1000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Gestion-Saude-Base_de_Datos
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "gestion-saude-backend.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGENS
        value: "https://gestion-saude.onrender.com,https://gestion-saude-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGENS
        value: "https://gestion-saude.onrender.com,https://gestion-saude-backend.onrender.com"
      - key: REDIS_URL
        sync: false
      - key: DEMO_PATIENT_USERNAME
        value: "patient"
      - key: DEMO_PATIENT_PASSWORD
        value: "patient123"

  - type: static
    name: Gestion-Saude-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gestion-saude-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
